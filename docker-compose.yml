services:
  agent-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # host.docker.internal lets the container reach Ollama running on your
      # Mac/Windows host. On Linux, replace this with the host's LAN IP or
      # run Ollama in its own container on the same Docker network instead.
      - OLLAMA_HOST=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen2.5:7b-instruct
    extra_hosts:
      - "host.docker.internal:host-gateway"
